<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps | Cutframe Studio</title>
<meta name="description" content="Software built by Cutframe Studio, including Orbit, an AI video editor available by invitation.">
<link rel="icon" href="/favicon.svg">
<link rel="canonical" href="https://cutframestudio.in/apps/">
<style>
  :root { --bg:#f8fafc; --ink:#0f172a; --mut:#526075; --line:#e2e8f0; --pri:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { background:#fff; border-bottom:1px solid var(--line); }
  .bar, main { max-width:880px; margin:0 auto; padding-left:16px; padding-right:16px; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-top:16px; padding-bottom:16px; }
  .logo { font-weight:700; color:var(--ink); text-decoration:none; font-size:18px; }
  .logo span { color:var(--pri); font-weight:600; }
  .back { color:var(--mut); text-decoration:none; font-size:14px; }
  main { padding-top:56px; padding-bottom:72px; }
  h1 { font-size:clamp(32px,6vw,44px); line-height:1.15; letter-spacing:-.02em; margin:0 0 10px; }
  .lead { color:var(--mut); margin:0 0 32px; max-width:560px; }
  a.card { display:block; background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; color:inherit; text-decoration:none; transition:border-color .2s, box-shadow .2s; }
  a.card:hover { border-color:var(--pri); box-shadow:0 8px 24px rgba(37,99,235,.1); }
  .tag { display:inline-block; font-size:12px; font-weight:600; color:var(--pri); background:#eff6ff; padding:3px 10px; border-radius:99px; margin-bottom:12px; }
  h2 { margin:0 0 6px; font-size:24px; }
  .card p { margin:0; color:var(--mut); }
  .more { display:inline-block; margin-top:16px; color:var(--pri); font-weight:600; }
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="/">Cutframe <span>Studio</span></a>
  <a class="back" href="/">Back to site</a>
</div></header>
<main>
  <h1>Apps</h1>
  <p class="lead">Software we build for video teams and creators.</p>
  <a class="card" href="/apps/orbit/">
    <span class="tag">By invitation</span>
    <h2>Orbit</h2>
    <p>An AI video editor that runs on your own computer. Automatic cuts, captions and reels, with your footage staying private.</p>
    <span class="more">See Orbit &rarr;</span>
  </a>
</main>
</body>
</html>

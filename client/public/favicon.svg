<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Outer glowing background circle for high visibility in dark and light browser tabs -->
  <circle cx="256" cy="256" r="240" fill="#070708" stroke="#ff9f1c" stroke-width="12" />
  
  <!-- Clapperboard Base -->
  <rect x="120" y="220" width="272" height="180" rx="12" fill="#1e1e24" stroke="#ffffff" stroke-width="12" />
  
  <!-- Chalkboard lines / internal slate details -->
  <path d="M160 280h192M160 330h140" stroke="#ff9f1c" stroke-width="8" stroke-linecap="round" />
  
  <!-- Clapperboard Top Bar (Angled slightly open at 14 degrees) -->
  <g transform="translate(120, 208) rotate(-14)">
    <rect x="0" y="-36" width="272" height="36" rx="6" fill="#ff9f1c" />
    <!-- Stripes on the top bar -->
    <path d="M40 -36l-20 36M100 -36l-20 36M160 -36l-20 36M220 -36l-20 36" stroke="#000000" stroke-width="12" />
  </g>
  
  <!-- Hinge pin -->
  <circle cx="120" cy="208" r="14" fill="#ffffff" />
</svg>
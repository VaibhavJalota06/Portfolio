<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="Cutframe Studio helps brands and businesses grow on Instagram: reels, posts, graphic design, AI videos and complete page management. Based in Delhi, working across India." />
    
    <!-- OpenGraph Social Meta -->
    <meta property="og:title" content="Cutframe Studio | We help brands grow on Instagram" />
    <meta property="og:description" content="Reels, posts, graphic design &amp; Instagram page management for brands, businesses and creators." />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cutframe Studio | We help brands grow on Instagram" />
    <meta name="twitter:description" content="Reels, posts &amp; Instagram page management for brands and businesses." />
    
    <title>Cutframe Studio | Reels, Posts &amp; Instagram Growth</title>
  </head>
  <body>
    <!-- Boot loader: visible instantly on load/refresh, hidden by main.jsx once the app has rendered.
         The inline timer below removes it after 6s no matter what, so it can never block the page. -->
    <style>
      #boot-loader { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #fff; transition: opacity .45s ease, visibility .45s ease; font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; }
      #boot-loader.done { opacity: 0; visibility: hidden; }
      #boot-loader .mark { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #1d4ed8, #2563eb 55%, #0ea5e9); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(37,99,235,.35); animation: boot-pop 1.2s ease-in-out infinite; }
      #boot-loader .name { font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: -.02em; }
      #boot-loader .name span { color: #2563eb; }
      #boot-loader .bar { width: 160px; height: 4px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
      #boot-loader .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 99px; background: #2563eb; animation: boot-slide 1s ease-in-out infinite; }
      @keyframes boot-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot-loader .mark, #boot-loader .bar::after { animation: none; } }
    </style>
    <div id="boot-loader" role="status" aria-label="Loading Cutframe Studio">
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/></svg>
      </div>
      <div class="name">Cutframe <span>Studio</span></div>
      <div class="bar"></div>
    </div>
    <script>setTimeout(function () { var l = document.getElementById('boot-loader'); if (l) l.remove(); }, 6000);</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

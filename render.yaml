services:
  - type: web
    name: portfolio-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && cd ../client && npm install && npm run build
    startCommand: node server.js
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/portfolio.db
      - key: TRUST_PROXY
        value: 2
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
